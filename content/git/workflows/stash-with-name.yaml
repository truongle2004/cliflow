id: stash-with-name
title: Stash unfinished work with a name
description: Save uncommitted work temporarily for a context switch.
tool:
  id: git
  name: Git
  description: Distributed version control system.
category:
  id: workflow
  name: Workflow
  description: Recommended daily development practices.
risk: low
tags:
  - git
  - stash
  - wip
  - context-switch
steps:
  - id: stash-push-message
    title: Create named stash
    description: Saves current uncommitted work with a readable label.
    command:
      program: git
      args:
        - stash
        - push
        - -m
        - "wip: name"
    risk: low
