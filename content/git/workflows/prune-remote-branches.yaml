id: prune-remote-branches
title: Prune stale remote branches
description: Remove local references to remote branches deleted from the remote.
tool:
  id: git
  name: Git
  description: Distributed version control system.
category:
  id: branches
  name: Branches
  description: Commands that create, inspect, or clean up branches.
risk: low
tags:
  - git
  - fetch
  - prune
  - cleanup
steps:
  - id: fetch-prune
    title: Fetch and prune
    description: Prunes stale remote-tracking references.
    command:
      program: git
      args:
        - fetch
        - -p
    risk: low
