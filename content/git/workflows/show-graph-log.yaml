id: show-graph-log
title: Show graph log
description: Inspect a compact decorated commit graph.
tool:
  id: git
  name: Git
  description: Distributed version control system.
category:
  id: history
  name: History
  description: Commands that inspect or modify commit history.
risk: low
tags:
  - git
  - log
  - graph
  - history
steps:
  - id: log-graph
    title: Show decorated graph
    description: Displays history in a compact graph format.
    command:
      program: git
      args:
        - log
        - --oneline
        - --graph
        - --decorate
    risk: low
