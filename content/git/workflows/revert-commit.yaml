id: revert-commit
title: Revert a shared commit safely
description: Create a new commit that reverses a pushed or shared commit.
tool:
  id: git
  name: Git
  description: Distributed version control system.
category:
  id: history
  name: History
  description: Commands that inspect or modify commit history.
risk: medium
tags:
  - git
  - revert
  - undo
  - history
steps:
  - id: revert-specific-commit
    title: Revert commit
    description: Replace COMMIT with the commit hash to revert.
    command:
      program: git
      args:
        - revert
        - COMMIT
    risk: medium
