id: undo-last-commit
title: Undo last commit
description: Undo the last Git commit while keeping changes staged.
tool:
  id: git
  name: Git
  description: Distributed version control system.
category:
  id: history
  name: History
  description: Commands that inspect or modify commit history.
risk: low
tags:
  - git
  - undo
  - commit
steps:
  - id: reset-soft-head
    title: Reset HEAD back one commit
    description: Moves HEAD back one commit and leaves file changes staged.
    command:
      program: git
      args:
        - reset
        - --soft
        - HEAD~1
    risk: low
