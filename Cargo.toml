[package]
name = "cliflow"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dirs = "6"
owo-colors = { version = "4", features = ["supports-colors"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "1"
toml = "0.9"
walkdir = "2"
