id = "view-logs"
namespace = "docker"
title = "View container logs"
description = "Streams logs from a Docker container."
example = "docker logs --follow api"
command = "docker logs --follow {container}"
tags = ["docker", "logs", "container", "debug"]
danger = "low"
args = [
  { name = "container", prompt = "Container name or ID" }
]
