id = "update-ecs-service"
namespace = "aws"
title = "Force a new ECS deployment"
description = "Forces a new deployment of an ECS service."
example = "aws ecs update-service --cluster app-cluster --service api --force-new-deployment --profile production"
command = "aws ecs update-service --cluster {cluster} --service {service} --force-new-deployment --profile {profile}"
tags = ["aws", "ecs", "service", "deploy"]
danger = "medium"
args = [
  { name = "cluster", prompt = "ECS cluster name or ARN" },
  { name = "service", prompt = "ECS service name" },
  { name = "profile", prompt = "AWS profile to use", default = "default" }
]
