id = "list-cost-by-service"
namespace = "aws"
title = "List cost by AWS service"
description = "Shows AWS spending grouped by service for a date range."
example = "aws ce get-cost-and-usage --time-period Start=2026-07-01,End=2026-08-01 --granularity MONTHLY --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE --profile production"
command = "aws ce get-cost-and-usage --time-period Start={start_date},End={end_date} --granularity {granularity} --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE --profile {profile}"
tags = ["aws", "cost", "billing", "service"]
danger = "low"
args = [
  { name = "start_date", prompt = "Start date YYYY-MM-DD" },
  { name = "end_date", prompt = "End date YYYY-MM-DD" },
  { name = "granularity", prompt = "Granularity", default = "MONTHLY" },
  { name = "profile", prompt = "AWS profile to use", default = "default" }
]
