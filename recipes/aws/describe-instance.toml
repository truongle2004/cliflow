id = "describe-instance"
namespace = "aws"
title = "Describe an EC2 instance"
description = "Shows full details for a specific EC2 instance."
example = "aws ec2 describe-instances --instance-ids i-0123456789abcdef0 --profile production"
command = "aws ec2 describe-instances --instance-ids {instance_id} --profile {profile}"
tags = ["aws", "ec2", "instance", "describe"]
danger = "low"
args = [
  { name = "instance_id", prompt = "EC2 instance ID" },
  { name = "profile", prompt = "AWS profile to use", default = "default" }
]
