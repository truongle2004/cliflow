id = "start-ec2-instance"
namespace = "aws"
title = "Start an EC2 instance"
description = "Starts a stopped EC2 instance."
example = "aws ec2 start-instances --instance-ids i-0123456789abcdef0 --profile production"
command = "aws ec2 start-instances --instance-ids {instance_id} --profile {profile}"
tags = ["aws", "ec2", "instance", "start"]
danger = "medium"
args = [
  { name = "instance_id", prompt = "EC2 instance ID" },
  { name = "profile", prompt = "AWS profile to use", default = "default" }
]
