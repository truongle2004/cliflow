id = "stash-with-name"
namespace = "git"
title = "Stash unfinished work with a name"
description = "Saves uncommitted work temporarily for a context switch without creating a commit."
command = "git stash push -m {name}"
tags = ["git", "stash", "wip", "context-switch"]
danger = "low"
args = [
  { name = "name", prompt = "Stash name", default = "wip: name" }
]
